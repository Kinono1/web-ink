name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run zip
      - run: node scripts/checksum.mjs
      - name: Verify release checksums
        working-directory: .output
        run: sha256sum -c *.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: web-ink-extension
          if-no-files-found: error
          path: |
            .output/*.zip
            .output/*.zip.sha256
