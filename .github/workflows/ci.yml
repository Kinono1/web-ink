name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test
      - name: Run bulk correctness tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/web-ink-ci-logs"
          npm run test:bulk 2>&1 | tee "$RUNNER_TEMP/web-ink-ci-logs/bulk.log"
      - run: npm run build
      - run: npm run test:release
      - run: npx playwright install --with-deps chromium
      - name: Prepare checksum-verified upgrade baseline
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/webink-baseline-download"
          curl -fL --retry 2 https://github.com/Kinono1/web-ink/releases/download/v0.3.0/web-ink-0.3.0-chrome.zip -o "$RUNNER_TEMP/webink-baseline-download/web-ink-0.3.0-chrome.zip"
          curl -fL --retry 2 https://github.com/Kinono1/web-ink/releases/download/v0.3.0/web-ink-0.3.0-chrome.zip.sha256 -o "$RUNNER_TEMP/webink-baseline-download/web-ink-0.3.0-chrome.zip.sha256"
          (cd "$RUNNER_TEMP/webink-baseline-download" && sha256sum -c web-ink-0.3.0-chrome.zip.sha256)
          node scripts/extract-runtime.mjs "$RUNNER_TEMP/webink-baseline-download/web-ink-0.3.0-chrome.zip" "$RUNNER_TEMP/webink-v030"
          echo "WEB_INK_OLD_BUILD=$RUNNER_TEMP/webink-v030" >> "$GITHUB_ENV"
      - run: npm run test:e2e
      - name: Verify minimum PDF browser (Chrome 125)
        shell: bash
        run: |
          curl -fsSL https://googlechromelabs.github.io/chrome-for-testing/125.0.6422.141.json -o "$RUNNER_TEMP/chrome125.json"
          PDF_BROWSER_URL=$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print(next(x["url"] for x in d["downloads"]["chrome"] if x["platform"] == "linux64"))' "$RUNNER_TEMP/chrome125.json")
          curl -fL --retry 2 "$PDF_BROWSER_URL" -o "$RUNNER_TEMP/chrome125.zip"
          unzip -q "$RUNNER_TEMP/chrome125.zip" -d "$RUNNER_TEMP/chrome125"
          WEB_INK_TEST_BROWSER_PATH="$RUNNER_TEMP/chrome125/chrome-linux64/chrome" npx playwright test tests/e2e/pdf.spec.ts
          WEB_INK_TEST_BROWSER_PATH="$RUNNER_TEMP/chrome125/chrome-linux64/chrome" npx playwright test tests/e2e/extension.spec.ts -g "query"
      - name: Verify minimum webpage browser (Chrome 120)
        shell: bash
        run: |
          curl -fsSL https://googlechromelabs.github.io/chrome-for-testing/120.0.6099.109.json -o "$RUNNER_TEMP/chrome120.json"
          WEB_BROWSER_URL=$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print(next(x["url"] for x in d["downloads"]["chrome"] if x["platform"] == "linux64"))' "$RUNNER_TEMP/chrome120.json")
          curl -fL --retry 2 "$WEB_BROWSER_URL" -o "$RUNNER_TEMP/chrome120.zip"
          unzip -q "$RUNNER_TEMP/chrome120.zip" -d "$RUNNER_TEMP/chrome120"
          WEB_INK_TEST_BROWSER_PATH="$RUNNER_TEMP/chrome120/chrome-linux64/chrome" npx playwright test tests/e2e/extension.spec.ts -g "real text marking|existing image marks|query|palette is quiet"
      - run: npm run zip
      - run: node scripts/checksum.mjs
      - name: Verify release checksums
        working-directory: .output
        run: sha256sum -c *.zip.sha256
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-ink-failure-diagnostics
          if-no-files-found: warn
          retention-days: 7
          # Keep diagnostics limited to CI logs and traces made from authored
          # test fixtures. Do not add user backups, IndexedDB snapshots, or imports.
          path: |
            ${{ runner.temp }}/web-ink-ci-logs/bulk.log
            test-results/**/trace.zip
      - uses: actions/upload-artifact@v4
        with:
          name: web-ink-extension
          if-no-files-found: error
          # Only these two explicit patterns are uploaded; other hidden files stay out.
          include-hidden-files: true
          path: |
            .output/web-ink-*-chrome.zip
            .output/web-ink-*-chrome.zip.sha256
