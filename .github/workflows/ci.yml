name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Verify minimum PDF browser (Chrome 125)
        shell: bash
        run: |
          curl -fsSL https://googlechromelabs.github.io/chrome-for-testing/125.0.6422.141.json -o "$RUNNER_TEMP/chrome125.json"
          PDF_BROWSER_URL=$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print(next(x["url"] for x in d["downloads"]["chrome"] if x["platform"] == "linux64"))' "$RUNNER_TEMP/chrome125.json")
          curl -fL --retry 2 "$PDF_BROWSER_URL" -o "$RUNNER_TEMP/chrome125.zip"
          unzip -q "$RUNNER_TEMP/chrome125.zip" -d "$RUNNER_TEMP/chrome125"
          WEB_INK_TEST_BROWSER_PATH="$RUNNER_TEMP/chrome125/chrome-linux64/chrome" npx playwright test tests/e2e/pdf.spec.ts
      - run: npm run zip
      - run: node scripts/checksum.mjs
      - name: Verify release checksums
        working-directory: .output
        run: sha256sum -c *.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: web-ink-extension
          if-no-files-found: error
          # Only these two explicit patterns are uploaded; other hidden files stay out.
          include-hidden-files: true
          path: |
            .output/web-ink-*-chrome.zip
            .output/web-ink-*-chrome.zip.sha256
